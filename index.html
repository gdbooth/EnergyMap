    DEPLOYMENT NOTES

    This is a fully self-contained static build.
    No backend server required.

    Data strategy
    ─────────────
    • /api/*  calls  →  intercepted by sw.js (Service Worker)
      Data is embedded directly in sw.js — no backend, no cache.
      Served fresh on every request with Cache-Control: no-store.

    • Live external APIs (fetched uncached on every load):
      - NOAA GML CO₂       https://global-warming.org/api/co2-api
      - NOAA GML CH₄       https://global-warming.org/api/methane-api
      - NOAA GML N₂O       https://global-warming.org/api/nitrous-oxide-api
      - NASA GISS Temp      https://global-warming.org/api/temperature-api
      - Open-Meteo CAMS     https://air-quality-api.open-meteo.com/v1/air-quality
      - WAQI AQI stations   https://api.waqi.info/map/bounds/

    Hosting
    ───────
    Upload this entire folder (index.html, sw.js, assets/) to any
    static host: GitHub Pages, Netlify, Vercel, Cloudflare Pages, S3, etc.
    Service Workers require HTTPS (or localhost).
    -->

    <style>
      /* Loading splash shown before React hydrates */
      #sw-splash {
        position: fixed; inset: 0;
        background: #0b0d12;
        color: #10b981;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 16px;
        font-family: Inter, system-ui, sans-serif;
        font-size: 13px;
        z-index: 9999;
        transition: opacity 0.4s;
      }
      #sw-splash.hide { opacity: 0; pointer-events: none; }
      #sw-splash svg { animation: spin 1.2s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      #sw-splash p { color: #7a8494; margin: 0; }
    </style>
  </head>
  <body>
    <!-- Loading splash -->
    <div id="sw-splash" role="status" aria-label="Loading">
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
        <circle cx="18" cy="18" r="14" stroke="#10b981" stroke-width="2" stroke-dasharray="55 35"/>
      </svg>
      <strong style="color:#dde2ea">Global Energy Map</strong>
      <p id="sw-status">Initialising…</p>
    </div>

    <div id="root"></div>

    <script>
      /**
       * Service Worker registration.
       * The SW intercepts all /api/* and port/5000/api/* calls
       * and returns embedded data with Cache-Control: no-store.
       *
       * Live external APIs (NOAA, Open-Meteo, WAQI) pass through
       * the SW unmodified — they are always fetched fresh from
       * their origin servers.
       */
      (function () {
        const splash = document.getElementById('sw-splash');
        const status = document.getElementById('sw-status');

        function hideSplash() {
          splash.classList.add('hide');
          setTimeout(() => splash.remove(), 500);
        }

        // Fallback: hide splash after 4 s regardless
        const fallback = setTimeout(hideSplash, 4000);

        if (!('serviceWorker' in navigator)) {
          status.textContent = 'Service Workers not supported — some API data may be unavailable.';
          clearTimeout(fallback);
          hideSplash();
          return;
        }

        // Register the service worker from the same directory
        navigator.serviceWorker
          .register('./sw.js', { scope: './' })
          .then(reg => {
            status.textContent = 'Loading energy data…';

            const activate = () => {
              clearTimeout(fallback);
              hideSplash();
            };

            if (reg.active) {
              // Already active — React can render immediately
              activate();
            } else {
              // Wait for the SW to activate (first install)
              const pending = reg.installing || reg.waiting;
              if (pending) {
                pending.addEventListener('statechange', function () {
                  if (this.state === 'activated') activate();
                });
              } else {
                activate();
              }
            }
          })
          .catch(err => {
            console.warn('SW registration failed:', err);
            clearTimeout(fallback);
            hideSplash();
          });
      })();
    </script>
  </body>
